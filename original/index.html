,{key:'6-1',no:22,id:'6-1',chap:CH6,name:'SOP 總驗收',task:'報修單：這台電腦不能上網',min:2,max:2,s2:'first',firstLabel:'沒有做多餘的處理',testLabel:'測試連線',idle:'按「測試連線」會從報修電腦開啟網頁',
 intro:'',start:'照 SOP 由下往上：看連線燈，ipconfig 看 IP，ping 閘道、ping 外面的 IP、ping 網址。哪一步不通，問題就在那一層。所有設備都可以點，畫面上有前任網管留下的交接筆記。',
 devs:(()=>{const fw=FW(),sw=SW();fw.tap=sw.tap=true;return{fw,sw,e1:DESK('報修電腦',''),e2:DESK('隔壁電腦','')}})(),
 zones:NOTE,fixed:SWFIX(),lay:L5,need:[],allow:swAllow,
 init(){const f=this.cause=['loose','vlan','pool','dns','rule'][Math.floor(rnd()*5)],d=this.devs.e1,n=this.devs.e2,cs=[{a:'e1.p',b:'sw.p1'},{a:'e2.p',b:'sw.p2'}];
   this.all=f==='dns'||f==='rule';
   this.devs.fw.cfg={end:f==='pool'?'192.168.88.119':'192.168.88.200',dns:f==='dns'?'10.0.0.53':'163.19.1.1',r103:'啟用',r104:'啟用',r105:'啟用'};
   this.devs.sw.cfg={p1:f==='vlan'?'VLAN 99':'VLAN 1',p2:'VLAN 1'};
   this.good={fw:{end:'192.168.88.200',dns:'163.19.1.1',r103:'啟用',r104:'啟用',r105:f==='rule'?'停用':'啟用'},sw:{p1:'VLAN 1',p2:'VLAN 1'}};
   d.noip=['loose','vlan','pool'].includes(f);d.dns=this.devs.fw.cfg.dns;d.subfn=()=>d.noip?'169.254.61.7':'192.168.88.130';n.sub='192.168.88.131';n.dns=d.dns;
   if(f==='loose')cs[0].broken=true;if(f==='vlan')this.devs.sw.ports.p1.vlan=99;
   return{cables:cs,intro:`導師打電話來：「我的電腦不能上網！」你到了教室。${this.all?'問了一下，隔壁電腦也一樣不行。':'問了一下，隔壁電腦一切正常。'}這一關的原因可能出在任何一層，把前面學過的工具都拿出來用。`}},
 cab:id=>cables.find(c=>dv(c.a)===id||dv(c.b)===id),
 full(){return !['192.168.88.200','192.168.88.254'].includes(D.fw.cfg.end)},
 rule(){return this.cause==='rule'&&D.fw.cfg.r105==='啟用'},
 blocked(){const c=this.cab('e1');if(!c||c.broken||this.full())return true;return pobj(dv(c.a)==='sw'?c.a:c.b).vlan===99},
 dok(d){return['163.19.1.1','8.8.8.8'].includes(d.dns)},
 web(){const d=D.e1;return !d.noip&&this.dok(d)&&!this.rule()&&!!this.cab('e1')&&D.fw.cfg.end!=='192.168.88.254'},
 onCfg(id,k){cfgFail(this,id,k);const v=D[id].cfg[k];
   if(id==='sw'){const p=D.sw.ports[k];if(v==='VLAN 99')p.vlan=99;else delete p.vlan}
   if(id==='fw'&&k==='dns')D.e2.dns=v},
 onDev(id){const L=this,d=D.e1;
   if(id==='e2'){const n=D.sw.ports.p2.vlan===99;say(n?'隔壁電腦剛剛還好好的，現在也不能上網了。':L.all&&(L.rule()||!L.dok(D.e2))?'隔壁電腦也打不開網頁。':'隔壁電腦可以正常上網。');return}
   if(id==='sw')return showActs('交換器：',[
     ['查看各埠狀態',()=>{const s=D.sw,rows=[1,2,3,4,5,6,7].map(n=>{const c=cables.find(x=>x.a==='sw.p'+n||x.b==='sw.p'+n);return `  ${n}　｜VLAN ${s.ports['p'+n].vlan||1}｜${c&&!c.broken?'已連線':'未連線'}`});
       showTerm('<span class="d">交換器 › 各埠狀態</span>\n  埠　｜VLAN｜連線\n'+rows.join('\n')+'\n  8　｜Trunk｜已連線（往防火牆）')}],
     ['修改埠的 VLAN',()=>showCfg('sw','交換器：各埠的 VLAN',[{k:'p1',label:'第 1 埠',opts:['VLAN 1','VLAN 99']},{k:'p2',label:'第 2 埠',opts:['VLAN 1','VLAN 99']}])],
     ['不處理',()=>{}]]);
   if(id==='fw')return showActs('防火牆（兼 DHCP 伺服器）：',[
     ['查看 DHCP 設定',()=>showTerm(DHCPV(D.fw.cfg,L.cause==='pool'))],
     ['查看防火牆規則',()=>showTerm(RULEV(D.fw.cfg,L.cause==='rule'))],
     ['修改 DHCP 設定',()=>showCfg('fw','防火牆的 DHCP 設定',DHCPF)],
     ['修改防火牆規則',()=>showCfg('fw','防火牆規則：啟用或停用',RULEF)],
     ['重新開機',()=>{fails++;say('防火牆重開，全校斷線三分鐘。回來之後問題還在。','bad')}],['不處理',()=>{}]]);
   const c=L.cab('e1'),link=c&&!c.broken;showActs('報修電腦：',[
     ['看連線燈',()=>say(link?'電腦網路孔和交換器那一埠的連線燈都亮著。':'電腦網路孔和交換器那一埠的連線燈都不亮。線有插著。')],
     ['ipconfig /all',()=>showTerm(IPC(d.noip?'169.254.61.7':'192.168.88.130',d.noip?'255.255.0.0':'255.255.255.0',d.noip?'':'192.168.88.254','\n  DNS 伺服器 . . : '+(d.noip?'（空白）':d.dns)))],
     ['ping 測試',()=>{const ip=!d.noip,nm=ip&&L.dok(d),o=(t,k)=>`<span class="d">C:\\&gt; ping ${t}</span>\n`+(k?'<span class="o">有回應</span>':'<span class="x">沒有回應</span>')+'\n';showTerm(o('192.168.88.254（閘道）',ip)+o('8.8.8.8（外面的 IP）',ip)+o('www.google.com（網址）',nm))}],
     ['重新領 IP',()=>{if(L.blocked())say('重新領取失敗：連絡不到 DHCP 伺服器，或沒有門牌可發。','bad');else{d.noip=false;d.dns=D.fw.cfg.dns;say('重新領到 192.168.88.130。','ok')}}],
     ['不處理',()=>{}]])},
 onCut(rc){if(rc.broken)say('這條線的水晶頭鬆脫了。換一條新線接回原來的埠，再請電腦重新領 IP。','ok');else{fails++;say('這條線是好的，記得接回去。','bad')}},
 check(){const ok=this.web(),H='從報修電腦開啟網頁',lines=[ok?'<span class="o">www.google.com：成功</span>':'<span class="x">www.google.com：無法連線</span>'];
   if(!ok&&D.fw.cfg.end==='192.168.88.254'&&!D.e1.noip)return{ok:false,head:H,lines,msg:'DHCP 範圍設到 192.168.88.254，那是閘道自己的位址。發到它的電腦會跟閘道撞號。範圍要照交接筆記設定。'};
   if(ok&&D.sw.ports.p2.vlan===99)return{ok:false,head:H,lines,msg:'報修電腦好了，可是第 2 埠被改到 VLAN 99，隔壁電腦反而斷線了。只改有問題的那一埠。'};
   return ok?{ok:true,head:H,lines:lines.concat(RULENOTE(D.fw.cfg))}:{ok:false,free:true,head:H,lines,msg:'還是不能上網。照 SOP 由下往上：連線燈、ipconfig、ping 閘道、ping 外面、ping 網址。'}},
 goals:[['找出原因並排除',()=>lvk('6-1').web()]],
 extra:'每一步先確認再動手',passMsg:'修好了！你已經能照 SOP 由下往上排除各層的問題。',
 hints:['先點隔壁電腦，確認是一台壞還是大家都壞。再點報修電腦看連線燈。','連線燈亮著，就執行 ipconfig /all。169.254 代表沒領到 IP，查看交換器各埠狀態和防火牆的 DHCP 設定，跟交接筆記比對。','有 IP 就做 ping 測試。只有網址不通是 DNS，比對 ipconfig 的 DNS 和交接筆記；三個都通但網頁打不開，查看防火牆規則，找出擋掉一般網頁（443）的那一條。'],
 learn:['<strong>先問範圍</strong>：一台壞查那一台，大家都壞查共用的設備。','<strong>由下往上</strong>：連線燈、IP、閘道、外面的 IP、網址。哪一步不通，問題就在那一層。','每一種工具回答一個問題：ipconfig 問「有沒有門牌」，ping 問「到不到得了」，nslookup 問「查不查得到名字」。'],
 tip:'實務經驗：網路故障不是玄學，都是可以拆解的科學。照著 SOP 一層一層查，真相只有一個。',see:['ping','special'],
 home:['把這一關的 SOP（看燈、ipconfig、ping 閘道、ping 外面的 IP、ping 網址）抄在一張卡上，貼在機櫃或辦公桌旁。'],
 close(){return CLOSE({loose:{rc:'報修電腦的網路線鬆脫',pv:'整理教室的線材，網路線固定好，不要被桌椅或腳踢到',say:'您電腦的網路線鬆了，已經重新接好'},vlan:{rc:'交換器那一埠被設在錯的 VLAN 99',pv:'交換器設定變更前先備份，改完記錄是哪一埠、改成什麼',say:'機房交換器有一個設定錯了，您的電腦被分到錯的網段，已經改回來'},pool:{rc:'DHCP 可以發放的 IP 已經全部發完',pv:'依實際設備數量規劃 DHCP 範圍，並定期看使用率',say:'學校可以發的網路門牌用完了，已經擴大範圍'},dns:{rc:'DHCP 發給電腦的 DNS 是一台已經停用的舊主機',pv:'設備停用前，先檢查有哪些設定指向它，每次變更都記錄下來',say:'網路設定還指向一台已經停用的舊主機，已經改成正確的 DNS'},rule:{rc:'防火牆規則 105 擋掉了教學網段對外的加密網頁（443）',pv:'防火牆規則的新增和修改都要記錄原因，改完從教室實際測試常用網站',say:'防火牆有一條規則誤擋了校外的網站，已經停用'}},this.cause,['每次有人報修，先把防火牆重開，多半就會恢復','把整間教室的電腦都重灌，設定會回到乾淨的狀態','把常見的設定方法教給老師，請老師自己先試著改'])}}

,{key:'6-2',no:23,id:'6-2',chap:CH6,name:'回報教網中心',task:'報修單：全校對外不通',min:1,max:1,s2:'first',firstLabel:'先測試，再回報',testLabel:'送出回報',goalLast:'教網中心確認收到',noCut:'校內的線路都是好的。',idle:'做完測試、填好回報內容，按「送出回報」',
 intro:'各棟都有老師打來：「不能上網！」但校務系統、印表機這些校內的東西都還能用。有些問題不在學校裡面，你修不了，要請教育網路中心處理。回報時講得越清楚，對方處理得越快。',
 start:'點教室電腦做四項測試，判斷問題在校內還是校外。再點「教育網路中心」，把測試結果填進回報內容。',
 devs:(()=>{const fw=FW();fw.tap=true;const c=WDEV('教網中心','服務電話');c.tag='點我回報';return{fw,sw:SW(),e1:DESK('教室電腦','192.168.88.60'),e2:c}})(),
 fixed:SWFIX(),lay:L5,need:[],allow:swAllow,
 init(){this.hop=rnd()<.5?1:2;this.did=new Set();this.early=false;this.devs.e2.cfg={scope:'',gw:'',dns:'',hop:''};this.devs.e2.tag='點我回報';return{cables:[{a:'e1.p',b:'sw.p1'}],intro:this.intro}},
 onCfg(){if(this.did.size<4)this.early=true},s2ok(){return !this.early&&fails===0},
 onDev(id){const L=this;
   if(id==='fw')return showActs('防火牆：',[['查看狀態',()=>say('防火牆運作正常，WAN 埠的連線燈也亮著。校內到防火牆這一段沒有問題。')],['重新開機',()=>{fails++;say('防火牆重開，連校務系統都跟著斷了三分鐘。回來之後對外還是不通。','bad')}],['不處理',()=>{}]]);
   if(id==='e2')return showCfg('e2','向教網中心回報',[{k:'scope',label:'影響範圍',opts:['只有一台電腦','只有一間教室','全校']},{k:'gw',label:'ping 學校閘道',opts:['通','不通']},{k:'dns',label:'ping 校外（8.8.8.8 和教網 DNS）',opts:['通','不通']},{k:'hop',label:'tracert 斷在',opts:['第 1 站之後','第 2 站之後','沒有斷']}]);
   showActs('教室電腦：',[
     ['ping 閘道 192.168.88.254',()=>{L.did.add('gw');showTerm('<span class="d">C:\\&gt; ping 192.168.88.254</span>\n<span class="o">回覆自 192.168.88.254：時間=1ms</span>');say('學校的閘道有回應。校內這一段是通的。')}],
     ['ping 8.8.8.8',()=>{L.did.add('ext');showTerm('<span class="d">C:\\&gt; ping 8.8.8.8</span>\n<span class="x">要求等候逾時。\n要求等候逾時。</span>');say('校外的 8.8.8.8 沒有回應。再 ping 教網的 DNS 對照看看。')}],
     ['ping 教網 DNS',()=>{L.did.add('dns');showTerm('<span class="d">C:\\&gt; ping 163.19.1.1</span>\n<span class="x">要求等候逾時。\n要求等候逾時。</span>');say('教網的 DNS 也沒有回應。有些 DNS 本來就不回 ping，但 8.8.8.8 也不通，可以確定是對外不通：閘道通、外面不通，問題在學校出口之後。')}],
     ['tracert 教網 DNS',()=>{L.did.add('tr');showTerm('<span class="d">C:\\&gt; tracert -d 163.19.1.1</span>\n  1    1 ms   192.168.88.254\n'+(L.hop===1?'  2    *      要求等候逾時\n  3    *      要求等候逾時':'  2    3 ms   10.12.11.254\n  3    *      要求等候逾時\n  4    *      要求等候逾時'));say(`第 ${L.hop} 站有回應，下一站開始就沒有了。把這個結果記下來，回報時用得到。`)}],
     ['不處理',()=>{}]])},
 check(){const c=D.e2.cfg,H='教網中心的回覆',w={scope:'全校',gw:'通',dns:'不通',hop:`第 ${this.hop} 站之後`};
   if(Object.keys(w).some(k=>!c[k]))return{ok:false,free:true,head:H,lines:[],msg:'回報內容還沒填完。點「教網中心」，四項都要填。'};
   const M={scope:'各棟都有人報修，影響範圍是全校。範圍報小了，教網中心會以為是你們校內的問題。',gw:'學校閘道實際上是通的。報成不通，對方會請你先查校內。回報之前先實際 ping 一次。',dns:'8.8.8.8 和教網 DNS 實際上都不通。報成通，對方會以為對外沒有問題。',hop:'tracert 斷的位置報錯了。再執行一次，看最後一個有回應的是第幾站。'};
   const bad=Object.keys(w).find(k=>c[k]!==w[k]);
   if(bad)return{ok:false,head:H,lines:['<span class="x">「你們回報的狀況和我們這邊看到的對不起來，請再確認一次。」</span>'],msg:M[bad]};
   return{ok:true,head:H,lines:[`<span class="o">「收到，資料很清楚。全校對外不通、閘道正常、斷在第 ${this.hop} 站之後。\n我們查到${this.hop===1?'貴校對外的光纖被道路施工挖斷':'區域網路中心的設備異常'}，已經派工處理。」</span>`]}},
 goals:[['完成四項測試',()=>lvk('6-2').did&&lvk('6-2').did.size>=4],['填好回報內容',()=>{const c=lvk('6-2').devs.e2.cfg||{};return !!(c.scope&&c.gw&&c.dns&&c.hop)}]],
 extra:'回報的每一項都要有實際測試的依據',passMsg:'過關！回報清楚，教網中心馬上就能接手。',
 hints:['點教室電腦，四項測試都做一遍：ping 閘道、ping 8.8.8.8、ping 教網 DNS、tracert。','閘道通、外面不通，代表問題不在校內。這時不要重開設備，直接回報。','點「教網中心」，照實填：影響範圍、ping 閘道和 ping 校外的結果、tracert 最後有回應的是第幾站。'],
 learn:['<strong>ping 閘道通、ping 外面不通</strong>，問題在學校出口之後，不是你修得了的。','回報要講四件事：<strong>影響範圍、閘道通不通、外面通不通、斷在哪一站</strong>。','校內正常時<strong>不要亂重開設備</strong>，只會讓原本能用的校內服務也中斷。'],
 tip:'實務經驗：把教育網路中心的服務電話貼在機櫃上。打電話前先備好 ping 和 tracert 的結果，對方通常一聽就知道往哪裡查。有些 DNS 伺服器本來就不回應 ping，所以校外至少 ping 兩個目標（例如 8.8.8.8 和教網 DNS）再下結論。',see:['speed'],
 home:['找出教網中心或縣市網路中心的報修電話和方式，貼在機櫃上。順便存一份平常 tracert 的結果。']}

,{key:'6-3',no:24,id:'6-3',chap:CH6,name:'畢業任務',task:'畢業任務：盤點自己的學校',min:0,max:0,testLabel:'完成盤點',goalLast:'按下「完成盤點」',idle:'',custom:true,
 intro:'最後一關沒有標準答案。把你自己學校的網路資料填進來，畫面會畫出你們學校的拓樸圖，終端機會產生一份盤點表。新手網管最需要的不是背指令，是知道自己學校的網路長什麼樣子。',
 start:'資料只存在你這台裝置的瀏覽器裡，不會傳到別的地方。不知道的欄位先空著，回學校查到再補。',
 devs:{},fixed:[],need:[],allow:()=>null,
 lay:{wide:{W:900,H:540,net:{x:0,y:0},rack:{x:0,y:0,w:0,h:0},pos:{}},narrow:{W:440,H:640,net:{x:0,y:0},rack:{x:0,y:0,w:0,h:0},pos:{}}},
 F:[['school','學校名稱',1,'例：金湖國小'],['blds','各棟名稱（用逗號分開）',1,'例：行政樓,教學樓,活動中心'],['gw','閘道 IP',1,'例：192.168.88.254'],['dns','DNS 伺服器',1,'依學校規定，ipconfig /all 查得到'],['tel','教網中心服務電話',1,''],['ssid','無線網路名稱',0,'例：School-Teacher, School-Student'],['rack','主機櫃在哪裡',0,'例：行政樓 2 樓電腦教室旁'],['ipt','固定 IP 分配表放在哪裡',0,'']],
 noTr:true, // 這一關的資料是學員自己填的，畫面不經過學校參數換字
 init(){this.v={};try{this.v=VIEW?{...VIEW.x}:JSON.parse(localStorage.getItem('nq-school')||'{}')}catch(e){}
   // 加入班級時，還沒填的欄位先帶入班級或學員自己的學校設定
   if(!VIEW&&XL){const c=SCHOOL,pre={school:c.school,blds:c.blds,gw:c.net+'.'+c.gw,dns:c.dns,tel:c.tel,ssid:Object.values(c.ssid).join(', ')};for(const k in pre)if(!this.v[k]&&pre[k])this.v[k]=pre[k]}
   return{cables:[],intro:this.intro}},
 blds(){return(this.v.blds||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean).slice(0,4)},
 onLoad(){const a=$('acts'),L=this;a.hidden=false;a.onclick=null;
   a.innerHTML=L.F.map(f=>`<label>${f[1]}${f[2]?'':'（選填）'}<input id="sc-${f[0]}" data-k="${f[0]}" placeholder="${f[3]}" autocomplete="off"></label>`).join('')+'<div class="btns"><button id="sc-copy">複製盤點表</button><button id="sc-print">列印 SOP 卡</button><button id="sc-save" hidden>存成我的學校網路設定</button></div>';
   L.F.forEach(f=>{$('sc-'+f[0]).value=L.v[f[0]]||''});
   a.oninput=e=>{const k=e.target.dataset.k;if(!k)return;L.v[k]=e.target.value;if(!VIEW)try{localStorage.setItem('nq-school',JSON.stringify(L.v))}catch(x){}unwin();build();L.sheet()};
   $('sc-copy').onclick=()=>{const t=L.text();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>say('盤點表已複製，可以貼到文件或訊息裡。','ok')).catch(()=>say('這個瀏覽器不允許自動複製。請直接選取終端機裡的文字來複製。'))};
   $('sc-print').onclick=()=>{$('printcard').innerHTML=L.card();document.body.classList.add('pc');window.print()};
   // 加入班級時，填一次就能用在所有關卡：閘道、學校名稱、各棟名稱、SSID 存成學員自己的學校設定
   $('sc-save').hidden=!(API&&WHO&&!WHO.bad&&!VIEW);
   $('sc-save').onclick=async()=>{const o=sheetSchool(L.v);if(!o){say('先填好閘道 IP，例如 10.20.30.254。網段會從閘道 IP 算出來。','bad');return}
     let err=await saveMySchool({...(WHO.school||{}),...o});
     if(err&&o.ssid&&/SSID/.test(err)){delete o.ssid;const e2=await saveMySchool({...(WHO.school||{}),...o});if(!e2){say('已存成你的學校網路設定，其他關卡的網段都換成你學校的。SSID 沒有存：四個都要不同、只能用英數字，可以在上方「學校網路設定」再改。','ok');return}err=e2}
     say(err?'沒有存成學校設定：'+err:'已存成你的學校網路設定。其他關卡的網段、SSID 都會換成你學校的；想改回講師的設定，按上方「學校網路設定」。',err?'bad':'ok')};
   L.sheet()},
 text(){const v=this.v,b=this.blds();return`【${v.school||'（學校名稱）'} 網路盤點表】\n對外線路：教育網路中心　服務電話：${v.tel||'待查'}\n閘道 IP：${v.gw||'待查'}\nDNS 伺服器：${v.dns||'待查'}\n建築：${b.length?b.join('、'):'待查'}\n無線網路：${v.ssid||'待查'}\n主機櫃位置：${v.rack||'待查'}\n固定 IP 分配表：${v.ipt||'待查'}\n\n故障時的 SOP：\n1. 先問範圍：一台、一間教室，還是整棟、全校\n2. 看連線燈和電源燈\n3. ipconfig 看有沒有領到 IP\n4. ping ${v.gw||'閘道'} → ping 8.8.8.8 → ping 網址（DNS：${v.dns||'待查'}）\n5. 閘道通、外面不通：不要重開設備，打 ${v.tel||'教網中心'} 回報`},
 // 列印用的 SOP 卡（對應投影片第 64 頁）。沒填的欄位印成底線，可以回學校手寫補上
 card(){const v=this.v,B=x=>(x||'').trim()?esc(sp(x.trim())):'<span class="pc-blank"></span>',b=this.blds();
   return`<h1>${B(v.school)} 網路報修 SOP</h1><p class="pc-sub">貼在機櫃或辦公桌旁。由上往下查，哪一步不通，問題就在那一段。</p><ol>
<li><b>先問範圍</b>：一台、一間教室、一整棟，還是全校？從什麼時候開始？</li>
<li><b>看燈號</b>：電腦網路孔和交換器那一埠的連線燈亮不亮；設備的電源燈亮不亮。</li>
<li><b>ipconfig /all</b>：有沒有領到 IP？169.254 開頭代表沒領到。</li>
<li><b>ping 閘道 ${B(v.gw)}</b>：不通，問題在校內（線路、交換器、VLAN）。</li>
<li><b>ping 8.8.8.8</b>：閘道通、這裡不通，問題在學校出口之後。</li>
<li><b>ping 網址、nslookup</b>：IP 通、網址不通，是 DNS。本校 DNS：${B(v.dns)}</li>
<li><b>校內正常、外面不通</b>：不要重開設備。打給教網中心 ${B(v.tel)}，說明影響範圍、ping 的結果、tracert 斷在哪一站。</li></ol>
<table><tr><th>建築</th><td>${b.length?esc(sp(b.join('、'))):B('')}</td></tr><tr><th>無線網路</th><td>${B(v.ssid)}</td></tr><tr><th>主機櫃位置</th><td>${B(v.rack)}</td></tr><tr><th>固定 IP 分配表</th><td>${B(v.ipt)}</td></tr></table>

function trace(start='pc.nic'){
  const adj={},add=(a,b,o)=>{(adj[a]=adj[a]||[]).push({to:b,o,rev:false});(adj[b]=adj[b]||[]).push({to:a,o,rev:true})};
  const up=k=>k==='net'||!D[dv(k)].down;
  cables.forEach(c=>c.bad||c.broken||!up(c.a)||!up(c.b)||add(c.a,c.b,c));LV.fixed.forEach(f=>up(f.a)&&up(f.b)&&add(f.a,f.b,f));
  for(const id in D)if(D[id].bridge&&!D[id].down){const ks=Object.keys(D[id].ports).map(p=>id+'.'+p);for(let i=1;i<ks.length;i++)add(ks[0],ks[i],null)}
  const par={[start]:null},depth={[start]:0},q=[start];let deep=start;
  while(q.length){const u=q.shift();for(const e of adj[u]||[])if(!(e.to in par)){par[e.to]={from:u,e};depth[e.to]=depth[u]+(e.o?1:0);if(depth[e.to]>depth[deep])deep=e.to;q.push(e.to)}}
  const ok='net' in par,segs=[],devs=new Set();
  for(let n=ok?'net':deep;par[n];n=par[n].from){devs.add(dv(n));if(par[n].e.o)segs.unshift({el:par[n].e.o.el,rev:par[n].e.rev})}
  return{ok,segs,devs};
}
function travel(segs,cb){
  segs=segs.filter(s=>s.el);
  if(reduce||quick||!segs.length){cb();return}
  pkt.setAttribute('visibility','visible');const per=LV.sources?280:520,t0=performance.now();
  (function f(now){const t=Math.max(0,(now-t0)/per),i=Math.min(segs.length-1,Math.floor(t));
    const s=segs[i],u=Math.min(1,t-i)*(s.half?.5:1),L=s.el.getTotalLength(),q=s.el.getPointAtLength(L*(s.rev?1-u:u));
    pkt.setAttribute('cx',q.x);pkt.setAttribute('cy',q.y);
    if(t<segs.length)requestAnimationFrame(f);else cb()})(t0);
}

  if(!c){t.innerHTML=h+(tForm?'':'<p class="row">還沒有班級。按「開新班」建立一個。</p>');return}
  const link=`${location.origin}${location.pathname}?join=${c.code}`;
  h+=`<div class="row">班級代碼 <code>${escA(c.code)}</code>學員連結 <code>${escA(link)}</code><button data-t="copy">複製連結</button><button data-t="cfg">學校網路設定（${tData&&tData.cfg?'已自訂':'遊戲預設'}）</button>講師金鑰 <code>${escA(c.key)}</code><button data-t="forget">${tArm==='forget'?'再按一次移除':'從這台電腦移除'}</button></div>`;
  if(tErr&&!tForm)h+=`<p class="row" style="color:var(--bad)">${escA(tErr)}</p>`;
  if(!tData){t.innerHTML=h+'<p class="row">讀取中…</p>';return}
  const S=tData.students,now=tData.now,on=S.filter(x=>now-(x.last_seen||0)<120e3).length;
  const stuck=(x,lv,p)=>p&&!p.w&&(p.a>=5||(x.cur_lv===lv&&now-x.cur_at>600e3&&now-(x.last_seen||0)<300e3));
  let nStuck=0;
  const rows=S.map(x=>{const won=COLS.filter(k=>(x.lv[k.lv]||{}).s>0).length;
    const cells=COLS.map(k=>{const p=x.lv[k.lv],st=stuck(x,k.lv,p);if(st)nStuck++;
      const cl=[k.ch?'ch':'',p&&p.s?'w':p?'o':'',x.cur_lv===k.lv&&now-(x.last_seen||0)<300e3?'now':'',st?'stuck':''].join(' ').trim();
      const tip=p?`${x.name} · ${k.full}：${p.s?'★'.repeat(p.s)+' 過關':'還沒過'}，測試 ${p.a} 次，${mins(p.ms)}${p.h!=null?`，提示 ${p.h} 次`:''}`:`${x.name} · ${k.full}：還沒開始`;
      return`<td class="${cl}${p?' pk':''}" title="${escA(tip+(p?'。點一下看每一步':''))}"${p?` data-t="cell" data-s="${x.id}" data-l="${k.lv}" tabindex="0"`:''}${tPick&&tPick.sid===x.id&&tPick.lv===k.lv?' aria-current="true"':''}>${p&&p.s?'★'.repeat(p.s):p&&p.a?p.a:p?'·':''}</td>`}).join('');
    return`<tr><th class="nm"><i class="${now-(x.last_seen||0)<120e3?'on':''}"></i>${escA(x.name)}${tShowRs?`<small>${escA(x.resume)}</small>`:''}<button data-t="rm" data-i="${x.id}" title="移除 ${escA(x.name)}">${tArm==='rm'+x.id?'確定移除？':'✕'}</button></th><td>${won}</td>${cells}</tr>`}).join('');
  const foot=COLS.map(k=>{const ps=S.map(x=>x.lv[k.lv]).filter(Boolean),w=ps.filter(p=>p.s).length,a=ps.length?ps.reduce((s,p)=>s+p.a,0)/ps.length:0;
    return`<td class="${k.ch?'ch':''}" title="${escA(k.full)}：${w}/${S.length} 人過關，平均測試 ${a.toFixed(1)} 次">${w}<br>${a?a.toFixed(1):''}</td>`}).join('');
  h+=`<div class="row"><span>${S.length} 位學員，${on} 人在線上${nStuck?`，<b style="color:var(--bad)">${nStuck} 格可能卡關</b>`:''}</span><label><input type="checkbox" data-t="rs" ${tShowRs?'checked':''}> 顯示復原碼</label><button data-t="csv">匯出 CSV</button><span>每 5 秒更新</span></div>`;
  if(tPick){const P=tPick,d=P.d,L=x=>x.e.length+' 步';
    h+=`<div class="row tpick"><b>${escA(P.name)} · ${escA(P.full)}</b>`+(!d?'<span>讀取中…</span>':d.error?`<span style="color:var(--bad)">${escA(d.error)}</span>`:
      !d.cur&&!d.done?'<span>這一關雲端上沒有存檔。學員可能是在加入班級之前玩的，或是用舊版的遊戲。</span>':
      (d.cur&&d.cur.e.length?`<button data-t="watch" data-w="cur">看目前這一局（${L(d.cur)}${d.cur.w?'，有過關':''}）</button>`:'')+
      (d.done?`<button data-t="watch" data-w="done">看過關的那一局（${'★'.repeat(d.done.w||1)}，${L(d.done)}）</button>`:''))+
      '<button data-t="pclose">關閉</button><span>會在新分頁打開，可以一步一步看。</span></div>'}
  h+=S.length?`<div class="tscroll"><table class="tgrid"><thead><tr><th class="nm" rowspan="2">學員</th><th rowspan="2">過關</th>${CHS.map(c=>`<th class="ch" colspan="${c.n}" title="${escA(c.full)}">${escA(c.name)}</th>`).join('')}</tr><tr>${COLS.map(k=>`<th class="${k.ch?'ch':''}" title="${escA(k.full)}">${escA(k.short)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody><tfoot><tr><th class="nm">過關人數<br>平均測試</th><td></td>${foot}</tr></tfoot></table></div>`
    :'<p class="row">還沒有學員加入。把上面的學員連結給學員，或請他們在遊戲上方按「加入班級」輸入班級代碼。</p>';
  h+='<p class="row">★ 過關星數；數字是還沒過關時的測試次數；· 開過但還沒測試。藍框是學員目前開著的關卡。紅底是可能卡關：測試 5 次以上還沒過，或同一關停留超過 10 分鐘。游標停在格子上看細節，點一下可以看學員每一步怎麼做；表頭的「修」是各章的報修單。名字旁的 ✕ 可以移除學員。</p>';
  t.innerHTML=h;
}
if(TEACH&&API){document.body.classList.add('teach');$('teach').hidden=false;document.title='講師總表 · 網管小學堂';
  $('teach').onclick=async e=>{const a=e.target.closest('[data-t]');if(!a)return;const k=a.dataset.t;
    if(k==='sel'){tSel=+a.dataset.i;tArm=null;tPick=null;tPoll()}
    else if(k==='cell'){const c=TC[tSel],sid=+a.dataset.s,lv=+a.dataset.l,x=tData.students.find(y=>y.id===sid),col=COLS.find(y=>y.lv===lv);
      tPick={sid,lv,name:x?x.name:'',full:col?col.full:'',d:null};teachView();
      try{const r=await fetch(`${API}class/${encodeURIComponent(c.code)}/student/${sid}/save/${lv}`,{headers:{authorization:'Bearer '+c.key}}),d=await r.json();
        if(tPick&&tPick.sid===sid&&tPick.lv===lv){tPick.d=r.ok?d:{error:d.error||'讀取失敗'};teachView()}}
      catch(e){if(tPick){tPick.d={error:'連不上伺服器。'};teachView()}}}
    else if(k==='watch'){const r=tPick&&tPick.d&&tPick.d[a.dataset.w];if(!r)return;
      const x=tData&&tData.students.find(y=>y.id===tPick.sid),sc={...(tData&&tData.cfg||{}),...(x&&x.school||{})};
      const u=location.origin+location.pathname+'#rec='+await pack({v:1,l:tPick.lv,s:r.s,e:r.e,w:r.w?1:0,n:tPick.name,...(Object.keys(sc).length?{c:sc}:{})});window.open(u,'_blank','noopener')}
    else if(k==='pclose'){tPick=null;teachView()}
    else if(k==='new'||k==='add'||k==='cfg'){tForm=k;tErr='';teachView();const x=$('teach').querySelector('form input');if(x)x.focus()}
    else if(k==='cancel'){tForm='';tErr='';teachView()}
    else if(k==='rs'){tShowRs=a.checked;teachView()}
    else if(k==='csv')tCsv();
    else if(k==='copy'){try{await navigator.clipboard.writeText(`${location.origin}${location.pathname}?join=${TC[tSel].code}`);a.textContent='已複製'}catch(x){}}
    else if(k==='forget'||k==='rm'){const arm=k==='rm'?'rm'+a.dataset.i:'forget';
      if(tArm!==arm){tArm=arm;teachView();setTimeout(()=>{if(tArm===arm){tArm=null;teachView()}},4000);return}
      tArm=null;
      if(k==='forget'){TC.splice(tSel,1);saveTC();tSel=0;tPoll()}
      else{const c=TC[tSel];await fetch(`${API}class/${encodeURIComponent(c.code)}/student/${a.dataset.i}`,{method:'DELETE',headers:{authorization:'Bearer '+c.key}});tFetch()}}};
  $('teach').onsubmit=async e=>{e.preventDefault();const f=e.target,v=f.elements,b=f.querySelector('.go'),msg=t=>{tErr=t;b.disabled=false;[...f.querySelectorAll('.msg')].pop().textContent=t};b.disabled=true;
    try{if(f.dataset.f==='new'||f.dataset.f==='cfg'){const cfg={...scRead(f,SC_CLASS),...scRead(f,SC_SCHOOL)},bad=scCheck(cfg);if(bad){msg('學校網路設定：'+bad);return}
        if(f.dataset.f==='cfg'){const c=TC[tSel],r=await fetch(`${API}class/${encodeURIComponent(c.code)}`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+c.key},body:JSON.stringify({cfg})}),d=await r.json();
          if(!r.ok){msg(d.error||'儲存失敗');return}tForm='';tErr='';tFetch();return}
        const r=await fetch(API+'class',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({secret:v.secret.value,name:v.name.value,code:v.code.value,cfg})});const d=await r.json();
        if(!r.ok){msg(d.error||'開班失敗');return}TC.push({code:d.code,name:d.name,key:d.key})}
      else{const code=v.code.value.toUpperCase().replace(/\s/g,''),key=v.key.value.toUpperCase().replace(/\s/g,'');
        const r=await fetch(`${API}class/${encodeURIComponent(code)}`,{headers:{authorization:'Bearer '+key}});const d=await r.json();
        if(!r.ok){tErr=d.error||'讀取失敗';b.disabled=false;f.querySelector('.msg').textContent=tErr;return}if(!TC.some(x=>x.code===code))TC.push({code,name:d.name,key})}
      saveTC();tSel=TC.length-1;tForm='';tErr='';tPoll()}
    catch(x){tErr='連不上伺服器。';b.disabled=false;f.querySelector('.msg').textContent=tErr}};
  $('teach').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.t==='cell'){e.preventDefault();e.target.click()}};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tFetch()});
  teachView();if(TC.length)tPoll();
}
const pick=()=>svg.parentElement.clientWidth<600?'narrow':'wide';
cards();
let st=lvk('pro').no;try{const v=localStorage.getItem('nq-level');if(v!=null&&BYNO[+v])st=+v}catch(e){}
setSchool(mySchool());load(st);openLink();
if(API&&new URLSearchParams(location.search).get('join')&&!WHO)whoMode='join';
if(!TEACH){whoBar();if(WHO&&!WHO.bad)pull().then(flush)}
new ResizeObserver(()=>{const m=pick();if(m!==mode&&!busy)layout(m)}).observe(svg.parentElement);
})();
